<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squid Game Bingo</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf/notyf.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/notyf/notyf.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Sans KR", sans-serif;
        /* background: linear-gradient(
          135deg,
          #df0060 0%,
          #ef2f75 50%,
          #ef1172 100%
        ); */
        background-color: #000;
        min-height: 100vh;
        color: #ffffff;
      }

      .header {
        background: rgba(0, 0, 0, 0.8);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid #249f9c;
      }
      .game-room {
        display: none;
      }
      .board-room {
        display: none;
      }
      .init-room {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 700px;
      }
      .logo {
        font-size: 2rem;
        font-weight: 900;
        color: #249f9c;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      .game-stats {
        display: flex;
        gap: 1rem;
        align-items: center;
      }

      .stat-item {
        background: rgba(237, 27, 118, 0.2);
        padding: 0.4rem;
        border-radius: 8px;
        border: 2px solid #ed1b76;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .stat-item.loading {
        background: linear-gradient(
          90deg,
          #e0e0e0 25%,
          #f0f0f0 50%,
          #e0e0e0 75%
        );
        background-size: 200% 100%;
        animation: loadingShimmer 1.5s infinite;
        color: transparent; /* hide text while loading */
        .stat-value {
          color: transparent;
        }
      }
      .stat-label {
        font-size: 0.75rem;
        opacity: 0.8;
      }

      .stat-value {
        font-size: 0.75rem;
        font-weight: 700;
        color: #249f9c;
      }

      .main-container {
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
      }

      .active-game-banner {
        background: linear-gradient(45deg, #249f9c, #037a76);
        color: #ffffff;
        padding: 1rem;
        border-radius: 12px;
        margin-bottom: 2rem;
        text-align: center;
        font-weight: 700;
        font-size: 1.1rem;
        box-shadow: 0 4px 15px rgba(36, 159, 156, 0.3);
      }

      .cartelas-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
      }

      .cartela-card {
        background: linear-gradient(135deg, #f44747, #ed1b5a);
        border: 3px solid transparent;
        border-radius: 6px;
        padding: 0.5rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 700;
        font-size: 4rem;
        position: relative;
        overflow: hidden;
      }

      .cartela-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          45deg,
          transparent 30%,
          rgba(255, 255, 255, 0.1) 50%,
          transparent 70%
        );
        transform: translateX(-100%);
        transition: transform 0.6s;
      }

      .cartela-card:hover::before {
        transform: translateX(100%);
      }

      .cartela-card:hover {
        transform: translateY(-5px);
        border-color: #249f9c;
        box-shadow: 0 8px 25px rgba(36, 159, 156, 0.4);
      }

      .cartela-card.reserved {
        background: linear-gradient(135deg, #424242, #212121);
        cursor: not-allowed;
        opacity: 0.6;
      }

      .cartela-card.reserved::after {
        content: "🔒";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.5rem;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background: linear-gradient(135deg, #1a1a1a, #000);
        border: 3px solid #249f9c;
        border-radius: 20px;
        padding: 2rem;
        max-width: 600px;
        width: 90%;
        text-align: center;
        position: relative;
      }

      .modal-title {
        font-size: 1.5rem;
        font-weight: 900;
        color: #249f9c;
        margin-bottom: 1rem;
      }

      .bingo-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin: 1.5rem 0;
        background: rgba(237, 27, 118, 0.1);
        padding: 1rem;
        border-radius: 12px;
      }

      .bingo-cell {
        background: linear-gradient(135deg, #f44786, #ed1b76);
        border: 1px solid #249f9c;
        border-radius: 8px;
        padding: 0.8rem;
        font-weight: 700;
        font-size: 1rem;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
      }

      .bingo-cell.free {
        background: linear-gradient(135deg, #249f9c, #037a76);
        color: #ffffff;
      }

      .modal-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 1.5rem;
      }

      .btn {
        padding: 0.8rem 2rem;
        border: none;
        border-radius: 25px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .btn-cancel {
        background: linear-gradient(135deg, #757575, #424242);
        color: white;
      }

      .btn-cancel:hover {
        background: linear-gradient(135deg, #616161, #212121);
        transform: translateY(-2px);
      }

      .btn-start {
        background: linear-gradient(135deg, #249f9c, #037a76);
        color: #ffffff;
      }

      .btn-start:hover {
        background: linear-gradient(135deg, #037a76, #249f9c);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(36, 159, 156, 0.4);
      }
      .btn-refresh-container {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .btn-refresh:hover {
        background: linear-gradient(135deg, #037a76, #249f9c);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(36, 159, 156, 0.4);
      }

      .btn-refresh {
        background: linear-gradient(135deg, #249f9c, #037a76);
        color: #ffffff;
      }

      .btn-refresh:hover {
        background: linear-gradient(135deg, #037a76, #249f9c);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(36, 159, 156, 0.4);
      }
      .connection-status {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 700;
        z-index: 1001;
      }

      .connection-status.connected {
        background: linear-gradient(135deg, #249f9c, #037a76);
        color: #ffffff;
      }

      .connection-status.disconnected {
        background: linear-gradient(135deg, #ed1b76, #f44786);
        color: #ffffff;
      }

      .players-online {
        background: rgba(36, 159, 156, 0.1);
        border: 2px solid #249f9c;
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 2rem;
        text-align: center;
      }

      .players-count {
        font-size: 1.2rem;
        font-weight: 700;
        color: #249f9c;
      }
      .cartela-card.loading {
        background: linear-gradient(
          90deg,
          #e0e0e0 25%,
          #f0f0f0 50%,
          #e0e0e0 75%
        );
        background-size: 200% 100%;
        animation: loadingShimmer 1.5s infinite;
        color: transparent; /* hide text while loading */
      }

      @keyframes loadingShimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      @media (max-width: 768px) {
        .header {
          flex-direction: column;
          gap: 1rem;
          padding: 1rem;
        }

        .game-stats {
          gap: 0.5rem;
        }

        .main-container {
          padding: 1rem;
        }

        .cartelas-grid {
          grid-template-columns: repeat(10, 1fr);
          gap: 0.3rem;
          max-width: 100%;
          margin: 0 auto 2rem auto;
        }

        .cartela-card {
          padding: 0.5rem;
          font-size: 0.9rem;
          height: 35px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .modal-content {
          padding: 1.5rem;
          margin: 1rem;
        }

        .bingo-grid {
          gap: 6px;
          padding: 0.8rem;
        }

        .bingo-cell {
          padding: 0.6rem;
          font-size: 0.9rem;
          min-height: 40px;
        }
      }
    </style>
    <style>
      .squid-bingo-container {
        font-family: "Arial", sans-serif;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        overflow: auto;
      }

      .bingo-board-main {
        padding: 4px;
      }
      .bingo-board {
        display: grid;
        grid-template-columns: repeat(16, 1fr);
        gap: 3px;
        background-color: #ed1b76;
        padding: 4px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      .number-cell {
        font-weight: 500;
        text-align: center;
        border-radius: 4px;
        font-size: clamp(0.8rem, 2vw, 1.2rem);
        transition: all 0.2s ease;
      }

      .number-cell.called {
        animation: pulse 0.4s;
        background-color: #249f9c;
        color: #ffd631;
      }

      .number-cell:hover {
        transform: scale(1.05);
        box-shadow: 0 0 8px rgba(241, 196, 15, 0.7);
      }

      .number-cell.selected {
        background-color: #fdcb06;
        color: #de1b05;
        position: relative;
      }

      .number-cell.selected::after {
        position: absolute;
        font-size: 1.5em;
        opacity: 0.8;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      @media (max-width: 600px) {
        .number-cell,
        .free-cell {
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="init-room" id="init-room">
      <div class="logo">🦑</div>
      Loading...
    </div>
    <div class="board-room" id="board-room">
      <header class="header">
        <div class="game-stats">
          <div class="stat-item">
            <div class="stat-label">Game</div>
            <div class="stat-value" id="roomName">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Wallet</div>
            <div class="stat-value" id="walletAmount">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Active Games</div>
            <div class="stat-value" id="activeGames">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Stake</div>
            <div class="stat-value" id="currentStake">0ETB</div>
          </div>
        </div>
      </header>

      <div class="main-container">
        <div class="cartelas-grid" id="cartelasGrid">
          <!-- Cartelas will be generated here -->
        </div>
        <div class="btn-refresh-container">
          <button class="btn btn-refresh" onclick="refreshBtn()">
            refresh
          </button>
        </div>
      </div>

      <div class="modal" id="cartelaModal">
        <div class="modal-content">
          <div class="modal-title">
            Cartela #<span id="modalCartelaNumber"></span>
          </div>
          <div class="bingo-grid" id="bingoGrid">
            <!-- 5x5 grid will be generated here -->
          </div>
          <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeModal()">
              Cancel
            </button>
            <button class="btn btn-start" onclick="startGame()">
              Start Game
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="game-room" id="game-room">
      <header class="header">
        <div class="game-stats">
          <div class="stat-item">
            <div class="stat-label">Game</div>
            <div class="stat-value" id="roomName2">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Players</div>
            <div class="stat-value" id="playersCount">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Stake</div>
            <div class="stat-value" id="currentStake2">0ETB</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Derash</div>
            <div class="stat-value" id="bets">0</div>
          </div>
        </div>
      </header>

      <div class="squid-bingo-container">
        <div class="bingo-board-main">
          <div class="bingo-board">
            <!-- Board will be generated by JavaScript -->
          </div>
        </div>
      </div>
      <div>
        <div>
          <div class="count-down" id="count-down"></div>
        </div>
      </div>
    </div>
    <script>
      const notyf = new Notyf({
        duration: 3000, // time in ms
        position: { x: "right", y: "top" }, // position on screen
        dismissible: true, // allow user to close
      });
      function notify(type, message) {
        if (type === "success") {
          notyf.success(message);
        } else if (type === "error") {
          notyf.error(message);
        } else {
          notyf.open({ type: type, message: message });
        }
      }
      class SquidGameBingo {
        constructor() {
          this.wallet = 0;
          this.activeGames = 0;
          this.stake = 0;
          this.roomId = null;
          this.roomPlayerId = null;
          this.roomName = "";
          this.stakeId = null;
          this.reservedCartelas = new Set();

          this.countdown = 10;
          this.currentCartela = null;
          this.playersCount = 0;
          this.bets = 0;
          this.drawnNumbers = new Set();
          this.currentNumber = null;
          this.markedCells = new Set();

          this.currentDiplay = "board-room";
          this.initializeGame();
          //   this.tg = window.Telegram.WebApp;
          this.tg = {
            initDataUnsafe: {
              user: {
                id: "344008794",
              },
            },
      };
        }

        async initializeGame() {
          this.loadStateFromURL();
          this.generateCartelas();
          this.generateNumbersBoard();
          await this.fetchRoomState();
          await this.fetchGameState();
          this.updateBoardRoomStats();
        }
        resetState() {
          this.wallet = 0;
          this.activeGames = 0;
          this.stake = 0;
          this.roomId = null;
          this.roomPlayerId = null;
          this.roomName = "";
          this.stakeId = null;
          this.reservedCartelas = new Set();
          this.drawnNumbers = new Set();
          this.currentNumber = null;
          this.currentCartela = null;
          this.playersCount = 0;
          this.bets = 0;
          this.currentDiplay = "board-room";
        }
        async clearUi() {
          this.resetState();
          const newUrl = `${window.location.pathname}`;
          window.history.replaceState({}, "", newUrl);
          await refreshBtn();
          this.updateBoardRoomStats();
          this.updateGameRoomStats();
        }
        saveStateToURL() {
          const params = new URLSearchParams(window.location.search);
          if (this.roomId) params.set("roomId", this.roomId);
          if (this.roomPlayerId) params.set("roomPlayerId", this.roomPlayerId);
          if (this.currentDiplay)
            params.set("currentDiplay", this.currentDiplay);

          const newUrl = `${window.location.pathname}?${params.toString()}`;
          window.history.replaceState({}, "", newUrl);
        }
        loadStateFromURL() {
          const params = new URLSearchParams(window.location.search);
          const roomId = params.get("roomId");
          const roomPlayerId = params.get("roomPlayerId");
          const currentDiplay = params.get("currentDiplay");

          if (roomId) this.roomId = roomId;
          if (roomPlayerId) this.roomPlayerId = roomPlayerId;
          if (currentDiplay) this.currentDiplay = currentDiplay;
        }
        generateCartelas() {
          const grid = document.getElementById("cartelasGrid");
          grid.innerHTML = "";

          for (let i = 1; i <= 100; i++) {
            const cartela = document.createElement("div");
            cartela.className = "cartela-card";
            cartela.textContent = i;
            cartela.onclick = () => this.openCartelaModal(i);
            grid.appendChild(cartela);
          }
        }
        generateNumbersBoard() {
          const bingoBoard = document.querySelector(".bingo-board");

          // BINGO header row
          const b = ["B"];
          const arr = Array.from({ length: 75 })
            .map((_, i) => i)
            .forEach((v) => {
              const num = v + 1;
              b.push(num);
              if (num === 15) {
                b.push("I");
              }
              if (num === 30) {
                b.push("N");
              }
              if (num === 45) {
                b.push("G");
              }
              if (num === 60) {
                b.push("O");
              }
            });
          b.forEach((letter) => {
            const cell = document.createElement("div");
            cell.className = "number-cell";
            cell.id = letter;
            cell.textContent = letter;
            bingoBoard.appendChild(cell);
          });
        }
        markDrawnNumbers(num) {
          this.drawnNumbers.add(num);
          // Update cartela appearance
          const cartelaCards = document.querySelectorAll(".number-cell");
          cartelaCards.forEach((el) => {
            el.classList.remove("called");
            if (Number(el.id) === this.currentNumber) {
              el.classList.add("called");
            }
            if (
              Number(el.id) !== this.currentNumber &&
              this.drawnNumbers.has(Number(el.id))
            ) {
              console.log(el.id, num, this.currentNumber);
              el.classList.add("selected");
            }
          });
        }
        openCartelaModal(cartelaNumber) {
          if (this.reservedCartelas.has(cartelaNumber)) {
            return;
          }

          this.currentCartela = cartelaNumber;
          document.getElementById("modalCartelaNumber").textContent =
            cartelaNumber;
          this.generateBingoGrid();
          document.getElementById("cartelaModal").style.display = "flex";
        }
        generateBingoGrid() {
          const grid = document.getElementById("bingoGrid");
          grid.innerHTML = "";

          // Generate random numbers for 5x5 bingo grid
          const numbers = [];
          const ranges = [
            [1, 15], // B
            [16, 30], // I
            [31, 45], // N
            [46, 60], // G
            [61, 75], // O
          ];

          for (let col = 0; col < 5; col++) {
            const colNumbers = [];
            const [min, max] = ranges[col];

            while (colNumbers.length < 5) {
              const num = Math.floor(Math.random() * (max - min + 1)) + min;
              if (!colNumbers.includes(num)) {
                colNumbers.push(num);
              }
            }
            numbers.push(colNumbers);
          }

          // Create grid cells
          for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 5; col++) {
              const cell = document.createElement("div");
              cell.className = "bingo-cell";

              if (row === 2 && col === 2) {
                cell.textContent = "FREE";
                cell.classList.add("free");
              } else {
                cell.textContent = numbers[col][row];
              }

              grid.appendChild(cell);
            }
          }
        }
        async startGame() {
          if (this.wallet < this.stake) {
            notify(
              "error",
              "Insufficient balance. Please top up your wallet before playing."
            );
            return;
          }
          await this.joinGame(this.currentCartela);
        }
        reservCartela(currentCartelaNum) {
          this.reservedCartelas.add(currentCartelaNum);

          // Update cartela appearance
          const cartelaCards = document.querySelectorAll(".cartela-card");
          cartelaCards[currentCartelaNum - 1].classList.add("reserved");

          // Show active game banner

          this.updateBoardRoomStats();
          this.closeModal();
        }
        removeCartela(cartelaNum) {
          // Remove from reserved set
          this.reservedCartelas.delete(cartelaNum);

          // Update cartela appearance
          const cartelaCards = document.querySelectorAll(".cartela-card");
          if (cartelaCards[cartelaNum - 1]) {
            cartelaCards[cartelaNum - 1].classList.remove("reserved");
          }

          // Update game stats
          this.updateBoardRoomStats();
        }
        endGame() {
          // Simulate win/loss
          const won = Math.random() > 0.7; // 30% win chance

          if (won) {
            const winnings = this.stake * (Math.random() * 3 + 2); // 2-5x stake
            this.wallet += winnings;
            alert(`🎉 BINGO! You won $${winnings.toFixed(2)}!`);
          } else {
            alert("😔 Better luck next time!");
          }

          this.activeGames--;
          this.reservedCartelas.delete(this.currentCartela);

          // Reset cartela appearance
          const cartelaCards = document.querySelectorAll(".cartela-card");
          cartelaCards[this.currentCartela - 1].classList.remove("reserved");

          this.updateBoardRoomStats();
        }
        closeModal() {
          document.getElementById("cartelaModal").style.display = "none";
          this.currentCartela = null;
        }
        updateBoardRoomStats() {
          document.getElementById("walletAmount").textContent =
            this.wallet.toLocaleString() + " ETB";
          document.getElementById("activeGames").textContent = this.activeGames;
          document.getElementById("roomName").textContent = this.roomName;
          document.getElementById("currentStake").textContent =
            this.stake + " ETB";
          const initRoomEl = document.getElementById("init-room");
          const boardRoomEl = document.getElementById("board-room");
          const gameRoomEl = document.getElementById("game-room");
          if (initRoomEl) initRoomEl.style.display = "none";
          if (this.currentDiplay === "game-room") {
            if (boardRoomEl) boardRoomEl.style.display = "none";
            if (gameRoomEl) gameRoomEl.style.display = "block";
          }
          if (this.currentDiplay === "board-room") {
            if (gameRoomEl) gameRoomEl.style.display = "none";
            if (boardRoomEl) boardRoomEl.style.display = "block";
          }
        }
        updateGameRoomStats() {
          document.getElementById("currentStake2").textContent =
            this.stake + " ETB";
          document.getElementById("roomName2").textContent = this.roomName;
          document.getElementById("bets").textContent =
            this.bets.toLocaleString() + " ETB";
          document.getElementById("playersCount").textContent =
            this.playersCount;

        updateActiveGames(roomCount) {
          this.activeGames = roomCount;
          this.updateBoardRoomStats();

        updateCountDown(num) {
          document.getElementById("count-down").textContent = num;

        setLoading() {
          const cartelaCards = document.querySelectorAll(".cartela-card");
          const statItems = document.querySelectorAll(".stat-item");
          statItems.forEach((card) => card.classList.add("loading"));
          cartelaCards.forEach((card) => card.classList.add("loading"));

        clearLoading() {
          const cartelaCards = document.querySelectorAll(".cartela-card");
          const statItems = document.querySelectorAll(".stat-item");
          cartelaCards.forEach((card) => card.classList.remove("loading"));
          statItems.forEach((card) => card.classList.remove("loading"));
        }
        async updateBoardRoomInfo(data, updateRoomId) {
          if (
            data.info &&
            typeof data.info.status === "string" &&
            data.info.status === "starting" &&
            this.currentDiplay === "board-room"
          ) {
            await this.fetchRoomState();
            return;
          }
          if (
            updateRoomId === true &&
            data.info &&
            typeof data.info.roomId === "string" &&
            this.roomId === null
          ) {
            this.roomId = data.info.roomId;
          }
          if (this.roomId !== data.info.roomId) {
            return;
          }

          if (typeof data?.wallet?.balance === "number") {
            this.wallet = data.wallet.balance;
          }

          // Update stake if provided
          if (typeof data?.info?.stakeAmount === "number") {
            this.stake = data.info.stakeAmount;
          }

          if (typeof data?.info?.roomName === "string") {
            this.roomName = data.info.roomName?.slice(1, 7);
          }

          if (typeof data?.roomCount === "number") {
            this.activeGames = data.roomCount;
          }
          if (data?.append > 0) this.reservCartela(data?.append);
          if (data?.remove > 0) this.removeCartela(data?.remove);
          // Update reserved cartelas from API
          if (Array.isArray(data.info?.reservedSpots)) {
            this.reservedCartelas.clear(); // reset first
            data.info.reservedSpots.forEach((spotNum) => {
              this.reservedCartelas.add(spotNum);
            });

            // Update cartela visuals
            const cartelaCards = document.querySelectorAll(".cartela-card");
            cartelaCards.forEach((card, index) => {
              card.classList.toggle(
                "reserved",
                this.reservedCartelas.has(index + 1)
              );
            });
          }

          // Update players count
          if (typeof data.info?.playersCount === "number") {
            this.playersOnline = data.info.playersCount;
          }

          // (Optional) You can store other state like currentNum, timeLeft, status
          this.timeLeft = data.info?.timeLeft || "";
          this.status = data.info?.status || "";

          // Refresh the UI
          this.updateBoardRoomStats();

          if (updateRoomId) {
            this.saveStateToURL();
          }
        }
        async updateGameRoomInfo(data) {
          // Update stake if provided
          if (typeof data?.info?.stakeAmount === "number") {
            this.stake = data.info.stakeAmount;
          }

          if (typeof data?.info?.roomName === "string") {
            this.roomName = data.info.roomName?.slice(1, 7);
          }
          if (typeof data?.roomCount === "number") {
            this.activeGames = data.roomCount;
          }
          if (typeof data?.info?.playersCount === "number") {
            this.playersCount = data.info.playersCount;
          }
          if (typeof data?.info?.bets === "number") {
            this.bets = data.info.bets;
          }

          if (typeof data?.info?.currentNum === "number") {
            this.currentNumber = data.info.currentNum;
          }
          if (Array.isArray(data.info?.allNum)) {
            this.drawnNumbers.clear(); // reset first
            data.info.allNum.forEach((num) => {
              this.markDrawnNumbers(num);
            });

            // Update cartela visuals
          }

          this.currentNum = data.info?.currentNum || 0;
          this.timeLeft = data.info?.timeLeft || "";
          this.status = data.info?.status || "";

          // Refresh the UI
          this.updateBoardRoomStats();
          this.updateGameRoomStats();

        async fetchRoomState() {
          this.setLoading();
          try {
            const response = await fetch(
              "https://main-server-dev.cartela-bingo.com/api/tg-bingo-game-room/get-room-info-by-stake-v2/9a186653-540e-45bc-a80b-36fecba41eaf/344008794"
            ); // replace with real API
            if (!response.ok) throw new Error("Failed to fetch game state");

            const data = await response.json();
            this.updateBoardRoomInfo(data, true);
            this.updateGameRoomInfo(data);
            // Update wallet
          } catch (error) {
            console.error("Error fetching game state:", error);
          } finally {
            this.clearLoading();
          }
        }
        async fetchGameState() {
          if (!this.roomPlayerId) {
            return;
          }
          this.setLoading();
          try {
            const response = await fetch(
              `https://main-server-dev.cartela-bingo.com/api/tg-room-player/my-game-v2/${this.roomPlayerId}`
            ); // replace with real API
            if (!response.ok) throw new Error("Failed to fetch game state");

            const data = await response.json();
            this.updateGameRoomStats();
            console.log();
            return;
            // Update wallet
          } catch (error) {
            console.error("Error fetching game state:", error);
          } finally {
            this.clearLoading();
          }
        }
        async joinGame(spotNumber) {
          this.setLoading();
          try {
            const response = await fetch(
              "https://main-server-dev.cartela-bingo.com/api/tg-bingo-game-room/join-game-v2",
              {
                headers: {
                  "x-telegram-auth": this.tg?.initData,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  room_id: this.roomId,
                  room_name: this.roomName,
                  tgUserId: this.tg?.initDataUnsafe?.user?.id,
                  spotNumber: spotNumber,
                }),
                method: "POST",
              }
            );

            const data = await response.json();

            if (data?.pId && data?.rId) {
              this.roomPlayerId = data?.pId;
              this.roomId = data?.rId;
              this.currentDiplay = "game-room";
              this.saveStateToURL();
              notify("success", "Joined Successfully");
              this.closeModal();
            } else if (data?.message) {
              const message = data?.message;
              notify("error", message);
              this.closeModal();
              console.log({
                message,
              });
            }
            console.log({
              data,
            });

            // Update wallet
          } catch (error) {
            console.error("Error fetching game state:", error);
          } finally {
            this.clearLoading();
          }
        }
      }

      function closeModal() {
        game.closeModal();
      }

      function startGame() {
        game.startGame();
      }

      async function refreshBtn() {
        await game.fetchRoomState();
      }
      // Initialize game
      const game = new SquidGameBingo();

      // Close modal when clicking outside
      document
        .getElementById("cartelaModal")
        .addEventListener("click", function (e) {

      // Keyboard support
      document.addEventListener("keydown", function (e) {

        }

      const socket = io("wss://main-server-dev.cartela-bingo.com", {
        query: {
          user_id: "344008794",
          stake_id: "9a186653-540e-45bc-a80b-36fecba41eaf",
        },
        transports: ["websocket"], // forces WebSocket transport
      });

      socket.on("connect", () => {
        console.log("✅ Connected to server:", socket.id);
      });

      socket.on("disconnect", () => {
        console.log("❌ Disconnected from server");
      });

      socket.on("board-room-update", (data) => {
        console.log(data);
        game.updateBoardRoomInfo(data, false);
      });
      socket.on("game-room-update", (data) => {
        console.log(data);
        game.updateGameRoomInfo(data, false);
      });
      socket.on("room-count", (data) => {
        if (data?.active > 0) game.updateActiveGames(data?.active);
      });
      socket.on("game-starting-countdown", (data) => {
        console.log(data);
        if (data?.at && data?.room && data?.room === game.roomId) {
          if (data.at === 1) return game.updateCountDown(``);
          game.updateCountDown(`Game Staring At ${data?.at}`);
        }
      });

      socket.on("room-trigger", async (data) => {
        if (data?.roomId === game.roomId && data?.status === "starting") {
          game.reservedCartelas.clear();
          const cartelaCards = document.querySelectorAll(".cartela-card");
          cartelaCards.forEach((card) => {
            card.classList.remove("reserved");
          });
          game.updateBoardRoomStats();
        }
        if (data?.roomId === game.roomId && data?.status === "completed") {
          await game.clearUi();
        }
      });
      socket.on("clearGameRoom", async (data) => {
        if (data?.room_id === game.roomId) {
          await game.clearUi();
        }
      });
