        html,

            justify-content: center;
        }

            font-weight: 900;

            align-items: center;
            gap: 20px;
            display: flex;
            padding-bottom: 5px;

            flex-direction: column;
            background: white;

            justify-content: center;
            align-items: center;
            display: flex;
        }

        .small-grid-container {
            display: grid;
            grid-template-columns: repeat(5, auto);

            align-items: center;

            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;

        .inner-container {
            justify-content: center;
            align-items: center;
            gap: 20px;
            display: inline-flex;
        }

        .refresh-button {
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 15px;
            padding-bottom: 15px;
            background: linear-gradient(0deg, #229ED9 0%, #229ED9 100%),

            align-items: center;
            gap: 5rem;
            display: flex;
            border: none;
            cursor: pointer;

        .refresh-button:hover {
            transform: scale(1.05); /* Add scale effect on hover */

        .refresh-button:active {
            transform: scale(0.95); /* Add scale effect on click */

        .start-game-button {

            padding-right: 20px;
            padding-top: 15px;
            padding-bottom: 15px;

            border: none;
            cursor: pointer;

        .start-game-button:hover {
            transform: scale(1.05); /* Add scale effect on hover */

        }

        .start-game-button:active {
            transform: scale(0.95); /* Add scale effect on click */
        }

        .button-text {
            text-align: center;
            color: #FEFDED;
            font-size: 14px;
            font-family: SF Pro Text;
            font-weight: 500;
            line-height: 20px;

            }

            }

        }

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var token = JSON.parse(document.getElementById('token').textContent);
        var socket_url = JSON.parse(document.getElementById('socket_url').textContent);
        var stake = JSON.parse(document.getElementById('stake').textContent)
        var board_numbers = JSON.parse(document.getElementById('board_numbers').textContent);
        var cartela = JSON.parse(document.getElementById('cartela').textContent);
        
        const socket = new WebSocket(socket_url);

        Telegram.WebApp.ready();
        const user_id = Telegram.WebApp.initDataUnsafe.user.id;
        const user_hash_string = Telegram.WebApp.initData;
        const csrftoken = document.querySelector("[name=csrfmiddlewaretoken]").value;
        const formData = new FormData();
        formData.append('user_id', user_id);
        formData.append('user_hash', user_hash_string);

        var selectedBoardNumber = null;

        //Populate the board grid
        var clickedCell = null;
        function createGrid() {
            const gridContainer = document.querySelector('.grid-container');
            for (let i = 1; i <= 100; i++) {
                const gridItem = document.createElement('div');
                gridItem.classList.add('grid-item');
                gridItem.textContent = i;
                gridContainer.appendChild(gridItem);
            }
        }

        createGrid();
        
        //change grid background color on click
        const gridItems = document.querySelectorAll('.grid-item');
        gridItems.forEach(item => {
            item.addEventListener('click', function selectGridItem(event) {
                const selectedItem = event.target;
                const clicked = selectedItem.dataset.clicked === 'true';
                gridItems.forEach(item => {
                    const itemColor = window.getComputedStyle(item).getPropertyValue('background-color');
                    if (itemColor !== 'rgb(255, 103, 1)' && itemColor !== '#FF6701'){
                        item.style.backgroundColor = '';
                        item.dataset.clicked = 'false';
                    }
                    
                });
                selectedBoardNumber = '';
                if (!clicked) {
                    const itemColor = window.getComputedStyle(item).getPropertyValue('background-color');
                    if (itemColor !== 'rgb(255, 103, 1)' && itemColor !== '#FF6701'){
                        selectedItem.style.backgroundColor = 'green'; // Change color as needed
                        selectedItem.dataset.clicked = 'true';
                        selectedBoardNumber = selectedItem.innerHTML
                    }
                    
                }
                generateSmallBoard(selectedItem.textContent);
            });
        });

        // Generate small board data
        function generateSmallBoard(startingNumber) {
            const smallGridContainer = document.querySelector('.small-grid-container');
            smallGridContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 5; j++){
                    const gridItem = document.createElement('div');
                    gridItem.classList.add('small-grid-item');
                    gridItem.textContent = cartela[startingNumber-1][i][j];
                    smallGridContainer.appendChild(gridItem);
                }
                
            }
        }

        // Socket on message received
        socket.onmessage = function(event) {
            const message = JSON.parse(event.data);
            var cells = document.querySelectorAll('.grid-item');
            if (message.message === "clear_board"){
                cells.forEach(function(cell) {
                    selectedBoardNumber = null
                    cell.style.backgroundColor = '';
                });

                const gameContainer = document.getElementById('gameNumberContainer');
                const currentValue = parseInt(gameContainer.textContent.trim(), 10);
                const newValue = currentValue + 1;
                gameContainer.textContent = newValue;
            }else if (String(message.message).startsWith("leave_game")){
                const board_message = message.message.split(",");
                const board_number = board_message[1];
                cells.forEach(function(cell) {
                    if (cell.textContent == board_number) {
                            cell.style.backgroundColor = '';
                    }
                });
            }else{
                cells.forEach(function(cell) {
                    if (cell.textContent == message.message) {
                        if (cell.style.backgroundColor === "green"){
                            selectedBoardNumber = null
                        }
                        cell.style.backgroundColor = "#FF6701";
                    }
                });
            }
        };

        // Join button click
        function handlePlayClick() {
            event.preventDefault();
            var startButton = document.getElementById("game_start");
            startButton.disabled = true;

            const csrftoken = document.querySelector("[name=csrfmiddlewaretoken]").value;
            formData.append('board_number', selectedBoardNumber);
            formData.append('stake', stake);
            fetch('/bingo/choose-board', {
                method: 'POST',
                body: formData,
                headers: {
                    'Authorization': user_hash_string,
                    'X-CSRFToken': csrftoken
                }
            })
            .then(response => {
            console.log(response);
            if (!response.ok) {
                startButton.disabled = false;
                throw new Error('Network response was not ok');
            }
            return response.json(); // Assuming the response is JSON
            })
            .then(data => {
                if (data.notify){
                    const toastEl = document.querySelector('.toast');
                    const toast = new bootstrap.Toast(toastEl);
                    const toastBody = toastEl.querySelector('.toast-body');
                    toastBody.innerText = data.notify;
                    toast.show();
                    startButton.disabled = false;
                }else if (data.dup) {
                    const toastEl = document.querySelector('.toast');
                    const toast = new bootstrap.Toast(toastEl);
                    const toastBody = toastEl.querySelector('.toast-body');
                    toastBody.innerText = data.dup;
                    toast.show();
                    startButton.disabled = false;
                }else{
                    window.location.href = "/bingo/game-play?" + token;
                }
            })

            // Re-enable the button after 3 seconds
            
        }

        // Refrash tge page
        function refreshPage() {
            location.reload();
        }
        
        //change grid background color from the server data
        if (board_numbers.length !== 0){
            for (var i = 0; i < board_numbers.length; i++) {
                var boardNum = board_numbers[i] - 1;
                gridItems[boardNum].style.backgroundColor = '#FF6701';
            }
        }
        

    </script>
