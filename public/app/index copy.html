<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Home</title>
    <link rel="stylesheet" href="/app/style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js?1"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // VConsole will be exported to `window.VConsole` by default.
      var vConsole = new window.VConsole();
    </script>
  </head>
  <body>
    <h1>Static HTML + Next.js API Demo</h1>

    <div>
      <button id="getBtn">Call GET API</button>
    </div>

    <div style="margin-top: 10px">
      <input
        type="text"
        id="inputText"
        placeholder="Write something to send to POST API"
      />
      <button id="postBtn">Call POST API</button>
    </div>

    <div id="output"></div>
    <nav>
      <a href="/">Home</a>
      <a href="/app/about.html">About</a>
      <a href="/app/contact.html">Contact</a>
    </nav>

    <script src="/app/app.js"></script>

</html>
